version: "3.9"
services:
  source_postgres:
    image: postgres:latest
    container_name: source_postgres
    ports:
      - "5433:5432"
    networks:
      - elt_network
    environment:
      POSTGRES_DB: source_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    volumes:
      - ./source_db_init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

  destination_postgres:
    image: postgres:latest
    container_name: destination_postgres
    ports:
      - "5434:5432"
    networks:
      - elt_network
    environment:
      POSTGRES_DB: destination_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    # volumes:
    #   - ./destination_db_init/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
  src:
    build:
      context: .
      dockerfile: Dockerfile
    command: [ "python",'./src/main.py' ]
    networks:
      - elt_network
    depends_on:
      - source_postgres
      - destination_postgres
    volumes:
      - .:/app

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin

    ports:
      - "5050:80"
    networks:
      - elt_network
    depends_on:
      - source_postgres
      - destination_postgres
networks:
  elt_network:
    driver: bridge
